environment:
  name: "LunarLander-v3"
  render_mode: none

algorithm:
  name: "PPO"
  log_dir: "runs/lunar_lander_v2"
  save_path: "lunar_lander_model.pth"

hyperparameters:
  learning_rate: 3.0e-4
  gamma: 0.99
  batch_size: 64
  buffer_capacity: 30000
  epsilon_decay: 0.2
  ppo_epochs: 4
  hidden_size: 64

seeds:
  train: 67
  eval: 42

training:
  episodes: 10000
